<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>The Art of Resilience — AR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      vr-mode-ui="enabled: false">
      <a-marker type="pattern" url="https://anna96-lvht.github.io/FloodLiteracyAR/pattern-TAR_Card_1_AR_test.patt">
        <a-box
          position="0 0.5 0"
          rotation="0 45 0"
          scale="0.5 0.5 0.5"
          color="#8B1A3A"
          opacity="0.9">
        </a-box>
        <a-text
          value="The Art of Resilience"
          position="0 1.2 0"
          align="center"
          color="#FFFFFF"
          scale="0.8 0.8 0.8">
        </a-text>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
